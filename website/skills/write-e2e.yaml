faq:
  - q: "What does a verification state mean, and why is there no 'skipped'?"
    a: "Each flow carries exactly one state earned by evidence: GENERATED (written, nothing run), STATIC_CHECKED (parses and passes the gates), VERIFIED_LOCAL (green under playwright test against a LOCAL origin), VALIDATED_LIVE (green with live DOM inspection), BLOCKED (a gate refused the work) or FAILED (ran red). When evidence is missing the lower state is recorded — a spec nobody executed is GENERATED, however confident the run feels. There is deliberately no 'skipped' state, because that is how unverified drafts get counted as coverage."
  - q: "What stops the skill from mutating a staging or production environment?"
    a: "The origin gate runs before anything executes, on the resolved base URL — --base-url when given, otherwise the project's playwright.config, so a flagless run against a production config is classified the same as an explicit --live run. LOCAL means it actually resolves to a local destination; STAGING is explicit only (--allow-external-origin or an exact ZUVO_E2E_STAGING_HOSTS match, never a hostname heuristic); everything else is EXTERNAL_UNKNOWN and read-only. Mutations additionally need --allow-destructive naming the operations, and E2E-Q8 fails any spec that mutates a non-local origin without a recorded consent."
  - q: "Where are the quality gates defined?"
    a: "In skills/write-e2e/references/quality-gates.md, which is the single authoritative table for E2E-Q1 through E2E-Q10; shared/includes/gate-registry.md registers the family by reference rather than restating it. The rest of the skill's detail lives alongside it in references/ — discovery-and-scoring.md, scaffold.md, playwright-patterns.md, network-mocking.md and live-validation.md — each loaded only when its phase begins."
  - q: "How many specs does one run generate?"
    a: "One for --scope or --flow, three for a bare --auto, and twenty only when a human asks by name with --max-flows 20. Volume is treated as a safety property: non-interactive hosts always behave as --auto, so a large default let an unattended run emit twenty unreviewed specs with nobody deciding to."
  - q: "What happens if Playwright is not installed?"
    a: "Preflight returns GENERATE_ONLY or BOOTSTRAP_REQUIRED and the run adapts instead of guessing. GENERATE_ONLY writes and static-checks specs with STATIC_CHECKED as the ceiling; BOOTSTRAP_REQUIRED prints the exact install command for a human to run. The probe never shells out to an unpinned npx playwright, which would install the runner it is supposed to be detecting."

arguments:
  - flag: "--scope <path>"
    description: "Restrict discovery to one app root, directory or route file — generates 1 flow"
  - flag: "[path]"
    description: "Deprecated positional alias for --scope. Still accepted; prefer the explicit flag"
  - flag: "--flow <name>"
    description: "Generate exactly the named flow — 1 flow"
  - flag: "--output <dir>"
    description: "Write specs under <dir> instead of the detected E2E root"
  - flag: "--base-url <url>"
    description: "Name the origin the specs target; classified by the origin gate before any request"
  - flag: "--max-flows N"
    description: "Explicit flow budget — the only way to ask for a large batch, 20 included, never assumed"
  - flag: "--live"
    description: "Permit live DOM and locator inspection against a permitted origin (needs Playwright MCP)"
  - flag: "--auto"
    description: "Skip the selection prompt and take the 3 highest-scored flows"
  - flag: "--flows"
    description: "Print the scored flow list and stop — no scaffold, no files"
  - flag: "--dry-run"
    description: "Plan through the scaffold and write nothing"
  - flag: "--allow-external-origin"
    description: "Consent to reaching a non-local origin, read-only. Does not authorize mutations"
  - flag: "--allow-destructive <ops>"
    description: "Consent to the named mutating operations; required by E2E-Q8 off a LOCAL origin"

checks:
  sections:
    - name: "E2E Quality Gates"
      id_range: "E2E-Q1 through E2E-Q10"
      count: 10
      items:
        - id: "E2E-Q1"
          name: "No arbitrary waits — no waitForTimeout, no networkidle, no polling sleeps"
          critical: true
        - id: "E2E-Q2"
          name: "Test independence and unique data — no ordering dependency, run-unique records"
          critical: true
        - id: "E2E-Q3"
          name: "Causal oracle — the assertion runs after the decisive event and observes its effect"
          critical: true
        - id: "E2E-Q4"
          name: "Fail-closed network policy — unrouted requests denied, no broad directory globs"
          critical: true
        - id: "E2E-Q5"
          name: "Mutation contract validation — request body, query and headers asserted"
          critical: true
        - id: "E2E-Q6"
          name: "Cleanup for destructive operations — teardown runs even when the test throws"
          critical: true
        - id: "E2E-Q7"
          name: "Runner and browser version compatibility with the pinned Playwright"
          critical: true
        - id: "E2E-Q8"
          name: "No external mutation flows without an explicit consent naming the origin"
          critical: true
        - id: "E2E-Q9"
          name: "Gray-box specs explicitly labeled CHARACTERIZATION or GRAYBOX"
          critical: true
        - id: "E2E-Q10"
          name: "Spec size limit and helper extraction for repeated multi-step sequences"
          critical: true

frameworks:
  - Playwright
  - Next.js (App Router + Pages Router)
  - React / Vite
  - NestJS (API-only request context)
  - Nuxt
  - Angular
  - Astro
  - Django
  - FastAPI
  - Laravel / Yii

modes:
  - name: "SCOPED"
    description: "--scope <path> (or the deprecated positional path) — one flow inside one app root or route."
  - name: "NAMED"
    description: "--flow <name> — generate exactly the named flow."
  - name: "FULL"
    description: "Discover, present the scored list, take the selection, generate."
  - name: "AUTO"
    description: "Non-interactive: skip selection and take the 3 highest-scored flows."
  - name: "DISCOVER"
    description: "--flows — print the scored list and stop."
  - name: "PREVIEW"
    description: "--dry-run — plan through the scaffold and write nothing."
  - name: "LIVE"
    description: "--live — DOM-verified locators against an origin the gate permits; VALIDATED_LIVE is reachable."

agents:
  - name: "Route Discoverer"
    role: "Scans routes, interactive components, API endpoints and auth patterns to build the candidate flow inventory."
  - name: "Coverage Analyzer"
    role: "Inventories existing specs and the coverage registry so 'already covered' can feed the score."
  - name: "Test Writer"
    role: "Generates specs for a flow batch from the causality contract, then scores them against the gates."

benchmarks:
