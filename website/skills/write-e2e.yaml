stats:
  - label: "Quality Gates"
    value: "10"
    detail: "E2E-Q1 through E2E-Q10 — every one of them critical, each needing an evidence line"
  - label: "Validation States"
    value: "6"
    detail: "GENERATED, STATIC_CHECKED, VERIFIED_LOCAL, VALIDATED_LIVE, BLOCKED, FAILED"
  - label: "Flow Scoring Signals"
    value: "5"
    detail: "Mutation type 30, auth 20, data sensitivity 20, traffic proxy 15, coverage gap 15"
  - label: "Flow Budget"
    value: "1 / 3 / 20"
    detail: "1 for --scope or --flow, 3 for bare --auto, 20 only when a human asks with --max-flows"
  - label: "Origin Classes"
    value: "3"
    detail: "LOCAL, STAGING, EXTERNAL_UNKNOWN — mutations off-LOCAL need a named consent"

problem: |
  Generated E2E tests fail in two directions. They are flaky — `waitForTimeout` bets on machine speed, `networkidle` never settles on an app with polling — and they are dishonest: a spec that was written but never executed gets reported as coverage, and an assertion that would still pass with the feature deleted is not an oracle. `zuvo:write-e2e` scans routes, forms, mutations and auth, scores flows by criticality, and writes specs around a causality contract: trigger, decisive event, pre-state, post-state, visible oracle, cleanup. Every spec is scored against ten critical gates, every flow carries exactly one verification state, and any run whose effective base URL is not local is classified before a single request leaves the machine.

how_it_works:
  - step: "Preflight — can Playwright actually run here"
    description: "Probes config, dependency, a runnable local binary and the browser cache to return READY, GENERATE_ONLY or BOOTSTRAP_REQUIRED. READY makes VERIFIED_LOCAL reachable; GENERATE_ONLY caps the run at STATIC_CHECKED and says so; BOOTSTRAP_REQUIRED prints the install command instead of running it. The skill never probes through an unpinned npx, which would install the thing it claims to detect."
  - step: "Origin gate — before anything executes"
    description: "Resolves the effective base URL from --base-url or the project's playwright.config, then classifies it LOCAL, STAGING or EXTERNAL_UNKNOWN. A flagless run against a config pointing at production is treated exactly like --live. Two separate consents: --allow-external-origin permits reaching a non-local origin read-only, --allow-destructive names the mutating operations. Anything else BLOCKS instead of degrading quietly."
  - step: "Discovery and scoring"
    description: "Route discovery and coverage analysis run in parallel, then each candidate flow is scored on five weighted signals — mutation 30, auth 20, sensitivity 20, traffic 15, uncovered 15 — and labelled with a confidence that measures how well the flow is understood, never how the markup is written. --flows stops here."
  - step: "Scaffold and generate"
    description: "New specs, fixtures and page objects are written; playwright.config changes are proposed, never auto-applied; production source is never edited to make a test pass. Each scenario starts from a causality contract, and any spec touching the network gets a fail-closed policy with an explicit allowed-host list and a hostname+method+pathname match key."
  - step: "Gates, adversarial review, verification ladder"
    description: "Each spec is scored against E2E-Q1 through E2E-Q10 from references/quality-gates.md — all ten critical, fixed in-run or emitted BLOCKED. Adversarial review runs on a scoped patch, then every flow lands on exactly one state: GENERATED, STATIC_CHECKED, VERIFIED_LOCAL, VALIDATED_LIVE, BLOCKED or FAILED. Missing evidence records the lower state."

output:
  artifact: "memory/e2e-coverage.md"
  format: "Playwright .spec.ts files under the detected E2E root (or --output <dir>), auth fixtures, optional page objects. Coverage registry rows carry a State column: | Flow ID | Name | Score | Confidence | Status | Spec File | Last Updated | State |."
  sections:
    - "WRITE-E2E COMPLETE summary — preflight state, origin class, flows, files, gates evidenced"
    - "Scored flow list with confidence and a one-line reason per flow"
    - "Per-spec gate report — one evidence line per gate, a missing line counts as NOT RUN"
    - "Verification state per flow (GENERATED / STATIC_CHECKED / VERIFIED_LOCAL / VALIDATED_LIVE / BLOCKED / FAILED)"
    - "Triage for red runs by category: locatorMiss, timing, data, auth, backend"

examples:
  - title: "Generated spec with a causal oracle and a fail-closed route policy"
    type: output_sample
    sample:
      language: typescript
      code: |
        // Generated by zuvo:write-e2e -- 2026-07-30
        // Flow: projects/create | Score: 88 | Confidence: HIGH | State: VERIFIED_LOCAL
        // Decisive event: POST /api/projects 201 | Oracle: project row rendered with the run-unique name

        import { randomUUID } from "node:crypto";
        import { test, expect } from "@playwright/test";

        // Context level, not page level: page.route cannot see service-worker
        // traffic, so a page-level policy reports fail-closed while the app
        // still talks to the network behind the test's back.
        test.use({ serviceWorkers: "block" });

        test.describe("Create Project", () => {
          let unique: string;
          let createdId: string | undefined;

          test.beforeEach(async ({ context, baseURL }) => {
            // Per test, never per module -- a second test in this file must not
            // inherit the first one's record.
            unique = `Acme ${Date.now()}-${test.info().parallelIndex}-${randomUUID().slice(0, 8)}`;

            // The allow-list is derived from the RESOLVED base URL. A literal
            // origin here aborts every request, including the document load,
            // the moment the app runs on another host or port.
            const appHost = new URL(baseURL!).hostname;
            await context.route("**/*", (route) =>
              new URL(route.request().url()).hostname === appHost
                ? route.continue()
                : route.abort("blockedbyclient"),                    // fail closed
            );
          });

          test("creates a project and shows it in the list", async ({ page }) => {
            await page.goto("/projects/new");
            await page.getByLabel("Project name").fill(unique);

            const created = page.waitForResponse(
              (r) => new URL(r.url()).pathname === "/api/projects" && r.request().method() === "POST",
            );
            await page.getByRole("button", { name: "Create project" }).click();
            const res = await created;

            expect(res.status()).toBe(201);                          // the DECLARED decisive event
            expect(res.request().postDataJSON()).toMatchObject({ name: unique });
            createdId = (await res.json()).id;                       // delete by id, never by name
            await expect(page.getByRole("row", { name: unique })).toBeVisible();
          });

          test.afterEach(async ({ page }) => {
            if (!createdId) return;
            // page.request carries the browser context's session; the bare
            // `request` fixture does not and would 401 on an authenticated route.
            const del = await page.request.delete(`/api/projects/${createdId}`);
            expect(del.ok(), "cleanup failed -- the record would outlive the run").toBeTruthy();
          });
        });
    explanation: "Satisfies E2E-Q1 (no arbitrary wait — the wait is tied to the request the click triggers), E2E-Q2 (the run-unique name is built per test, so a second test in the file cannot reuse it), E2E-Q3 (the status assertion checks the decisive event the header declares, and the row assertion observes state only the creation could produce), E2E-Q4 (context-level deny-all with an allow-list derived from the resolved base URL, plus blocked service workers), E2E-Q5 (the POST body is asserted, not just the URL) and E2E-Q6 (teardown runs even when the body throws, deletes by id, and fails loudly if cleanup did not happen)."
  - title: "Preview the ranked flows without writing anything"
    type: invocation
    command: "zuvo:write-e2e --scope src/app/checkout --flows"
    result: "Runs preflight, the origin gate and discovery only, then prints the scored list with confidence and reasons and stops. --dry-run goes one phase further — through the scaffold plan — and still writes no files."

when_to_use: "Use `zuvo:write-e2e` when a web application has no E2E coverage, after adding routes or user flows, or when the existing suite is flaky for the reasons E2E-Q1 and E2E-Q2 describe. Use `--base-url` to name the origin the specs target, and `--live` when the app is running and you want DOM-verified locators."

when_not_to_use: "For unit and integration tests on individual functions, services, or components, use `zuvo:write-tests` — E2E tests are slower, harder to maintain, and test at the wrong granularity for logic-level coverage. For fixing flaky or broken E2E tests, use `zuvo:fix-tests`. For auditing existing E2E test quality, use `zuvo:test-audit --include-e2e`."

