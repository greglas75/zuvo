    type: accuracy
    verifiable: true
    source: "skills/write-e2e/references/quality-gates.md"
  - claim: "5-signal weighted flow scoring with weights: mutation type 30, auth requirement 20, data sensitivity 20, traffic proxy 15, existing coverage gap 15."
    type: coverage
    verifiable: true
    source: "skills/write-e2e/references/discovery-and-scoring.md"
  - claim: "Origin classification runs on the resolved base URL before anything executes, so a flagless run against a non-local playwright.config is gated exactly like --live."
    type: accuracy
    verifiable: true
    source: "SKILL.md Phase 0.5: Origin gate"
  - claim: "Flow volume is 1 for --scope or --flow, 3 for bare --auto, and 20 only on an explicit --max-flows request."
    type: accuracy
    verifiable: true
    source: "SKILL.md Argument Parsing table"

comparison_table:
  columns: ["Capability", "Playwright Codegen", "Manual writing", "zuvo:write-e2e"]
  rows:
    - ["Flow scoring and prioritization", "None", "Reviewer-dependent", "5-signal weighted score"]
    - ["Assertion is causally tied to the event", "Records what happened", "Reviewer-dependent", "E2E-Q3 causality contract"]
    - ["Unrouted network traffic", "Passes through", "Reviewer-dependent", "E2E-Q4 fail-closed policy"]
    - ["Mutation payload verified", "None", "Reviewer-dependent", "E2E-Q5 contract assertions"]
    - ["Arbitrary waits", "Emits them", "Common", "E2E-Q1 critical gate"]
    - ["What the run proves", "Nothing stated", "Undocumented", "One verification state per flow"]
    - ["Mutating a non-local origin", "Whatever you point it at", "Whatever you point it at", "BLOCKED without a named consent"]
