meta:
  slug: write-e2e
  title: "Write E2E — Playwright specs with causal oracles and a verification ladder"
  description: "Generate Playwright E2E specs from codebase analysis. Ten critical gates, a fail-closed network policy, and a state that says what was actually proven."
