problem: |
  Working directly on a branch in the main checkout risks contaminating ongoing work with experimental
  changes, and makes it hard to switch context cleanly. Git worktrees solve this by placing each branch
  in its own directory — but setting one up correctly (location, dependency install, baseline tests)
  takes multiple manual steps that are easy to skip, and nothing ever cleans them up afterwards. Put
  them inside the repo as `.worktrees/` and every filesystem-level tool — code indexers, cloc,
  duplication scans, glob-based test discovery — counts every file N+1 times. `/worktree` automates the
  full CREATE-to-FINISH lifecycle with safety checks at every step, defaults to a sibling directory
  outside the repo, and adds a PRUNE mode that reclaims finished worktrees.

how_it_works:
  - step: "Mode Detection"
    description: "Automatically detects whether the current directory is inside a worktree (FINISH) or the main checkout (CREATE), and honors an explicit create/finish/prune override."
  - step: "CREATE — Directory outside the repo"
    description: "Defaults to a sibling ../<repo>-worktrees/ so nested checkouts never pollute indexers or duplication scans. Honors $ZUVO_WORKTREE_DIR, a CLAUDE.md preference, or an existing layout — warning when that layout is nested. No .gitignore entry is needed for the sibling default."
  - step: "CREATE — Branch + Setup"
    description: "Creates the worktree on a new branch, then auto-detects the dependency system (10 package managers supported) and runs the appropriate install command."
  - step: "CREATE — Baseline Verification"
    description: "Runs the project's test suite to establish a green baseline. Reports pass/fail count. Pre-existing failures are surfaced before any work begins."
  - step: "FINISH — State Summary"
    description: "Reports branch name, commits ahead of base, and uncommitted changes. Blocks all finish options if uncommitted changes exist."
  - step: "FINISH — Completion"
    description: "User selects 1 of 4 options: Merge Locally (runs tests, merges, removes worktree), Push+PR (pushes, creates gh pr, removes worktree), Keep As-Is (preserves everything), or Discard (requires typed confirmation)."
  - step: "PRUNE — Reclaim and relocate"
    description: "Reconciles git bookkeeping, then classifies every live worktree as reclaimable (clean and merged into base), idle (clean, unmerged, older than 30 days) or active. Removes only the reclaimable ones — never with --force — migrates nested worktrees out of the repo with git worktree move, and flags when the code index needs rebuilding."

output:
  artifact: "No file artifact — worktree lifecycle managed in-place"
  format: "Structured status report printed after CREATE and after each FINISH option. Source files modified only by Merge (git merge) or Discard (worktree + branch deletion)."
  sections:
    - "Worktree path, branch, base branch, short hash"
    - "Dependency setup result"
    - "Baseline test pass/fail count"
    - "FINISH state summary (commits ahead, clean/dirty)"
    - "Completion report (merge result, PR URL, or preserved path)"
    - "PRUNE report (records cleared, reclaimed, skipped, idle, active, layout, re-index flag)"

